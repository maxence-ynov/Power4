<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Power 4 - Demarrage</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <h1>Power 4</h1>

  <main class="start-wrap">
    <section class="card start-card">
      <h2>Nouvelle partie</h2>
      <p class="hint">Entrez les noms et choisissez la difficulte.</p>

      <form action="/start-game" method="post" class="form" autocomplete="off">
        <div>
          <label class="label" for="player1">Nom du joueur 1</label>
          <input class="input" id="player1" name="player1" placeholder="Ex. Alice" required />
        </div>

        <div>
          <label class="label" for="player2">Nom du joueur 2</label>
          <input class="input" id="player2" name="player2" placeholder="Ex. Bob" required />
        </div>

        <div>
          <label class="label" for="level">Niveau de difficulte</label>
          <select class="select" id="level" name="level" required>
            <option value="easy">Facile (6x7)</option>
            <option value="normal" selected>Normal (6x9)</option>
            <option value="hard">Difficile (7x8)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Commencer la partie</button>
      </form>
    </section>
  </main>
</body>
</html>
