<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Connect Four</h1>
    {{if .Winner}}
        <h2>Player {{.Winner}} wins!</h2>
    {{else if .Draw}}
        <h2>Draw!</h2>
    {{else}}
        <h2>Player {{.Turn}}'s turn</h2>
    {{end}}
    <div id="game-board">
        {{range $colIndex, $column := .Board}}
            <div class="column">
                {{range $rowIndex, $cell := $column}}
                    <div class="cell {{if eq $cell 1}}player1{{else if eq $cell 2}}player2{{end}}"></div>
                {{end}}
            </div>
        {{end}}
    </div>
    {{if not (or .Winner .Draw) }}
    <form action="/play" method="post">
        <label for="column">Choose a column:</label>
        <select name="column" id="column">
            {{range seq 0 (sub .Columns 1)}}
                <option value="{{.}}">{{.}}</option>
            {{end}}
        </select>
        <button type="submit">Play</button>
    </form>
    {{end}}
    {{if or .Winner .Draw}}
    <form action="/reset" method="post">
        <button type="submit">Rematch</button>
    </form>
    {{end}}
</body>
</html>
